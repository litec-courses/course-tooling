name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ci / build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build theme previews
        run: bun run build

      - name: Test course publisher
        run: bun run test:publish:skip-pdf

      - name: Test portal publisher
        run: bun run test:portal

      - name: Validate portal search directives
        run: |
          grep -F 'noindex, nofollow, noarchive' dist/portal-test/index.html
          grep -F 'Disallow: /' dist/portal-test/robots.txt

      - name: Validate generated starter archive
        run: unzip -t dist/publisher-test/downloads/example-starter-resource-1.zip

      - name: Check package contents
        run: bun pm pack --dry-run --ignore-scripts

      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest -color
