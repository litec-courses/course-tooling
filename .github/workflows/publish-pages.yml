name: Publish Slidev course

on:
  workflow_call:
    inputs:
      bun-version:
        description: Bun version used for the course build
        type: string
        default: 1.4.2
      config-path:
        description: Publish configuration relative to the course repository
        type: string
        default: lectures/publish.yml
      output-directory:
        description: Pages output directory relative to the course repository
        type: string
        default: dist

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out course repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium system dependencies
        run: bunx playwright install --with-deps chromium

      - name: Build Pages site
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
          PUBLISH_CONFIG: ${{ inputs.config-path }}
          PUBLISH_OUTPUT: ${{ inputs.output-directory }}
        run: bun run pages:build

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.output-directory }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
